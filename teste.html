<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat de Áudio - Transcrição Gemini</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --accent:#6366f1; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:16px 20px; background:var(--panel); font-weight:600; font-size:18px; border-bottom:1px solid #334155; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:80%; padding:12px 16px; border-radius:14px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--panel); border-bottom-left-radius:4px; }
  .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  footer { padding:16px 20px; background:var(--panel); border-top:1px solid #334155; display:flex; align-items:center; gap:14px; justify-content:center; }
  #recBtn { width:64px; height:64px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:26px; cursor:pointer; transition:transform .1s, background .2s; display:flex; align-items:center; justify-content:center; }
  #recBtn:hover { transform:scale(1.05); }
  #fileBtn { width:48px; height:48px; border-radius:50%; border:1px solid #334155; background:transparent; color:var(--text); font-size:20px; cursor:pointer; }
  #fileBtn:hover { background:#334155; }
  #recBtn:disabled { cursor:not-allowed; }
  #recBtn.recording { background:#ef4444; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(239,68,68,.6);} 70%{box-shadow:0 0 0 16px rgba(239,68,68,0);} 100%{box-shadow:0 0 0 0 rgba(239,68,68,0);} }
  #status { font-size:14px; color:var(--muted); min-width:160px; }
  .dot-typing::after { content:'...'; animation:dots 1.2s steps(4,end) infinite; }
  @keyframes dots { 0%,20%{content:'';} 40%{content:'.';} 60%{content:'..';} 80%,100%{content:'...';} }
</style>
</head>
<body>
  <header>🎙️ Chat de Áudio — Transcrição por Gemini</header>
  <div id="chat">
    <div class="msg bot">Olá! Toque no botão do microfone e grave um áudio. Vou transcrevê-lo para você.</div>
  </div>
  <footer>
    <button id="recBtn" title="Gravar áudio">🎤</button>
    <button id="fileBtn" title="Enviar arquivo de áudio">📎</button>
    <input id="fileInput" type="file" accept="audio/*" style="display:none" />
    <div id="status">Pronto para gravar</div>
  </footer>
<script>
  const TRANSCRIBE_URL = 'https://dallroot.app.n8n.cloud/webhook/audio-chat-transcribe';
  const chat = document.getElementById('chat');
  const recBtn = document.getElementById('recBtn');
  const fileBtn = document.getElementById('fileBtn');
  const fileInput = document.getElementById('fileInput');
  const statusEl = document.getElementById('status');
  let mediaRecorder, chunks = [], recording = false;

  function addMessage(text, who, extraClass) {
    const div = document.createElement('div');
    div.className = 'msg ' + who + (extraClass ? ' ' + extraClass : '');
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      chunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        sendAudio(blob);
      };
      mediaRecorder.start();
      recording = true;
      recBtn.classList.add('recording');
      recBtn.textContent = '⏹';
      statusEl.textContent = 'Gravando... toque para parar';
    } catch (err) {
      statusEl.textContent = 'Erro ao acessar o microfone';
      addMessage('Não consegui acessar o microfone: ' + err.message, 'bot');
    }
  }

  function stopRecording() {
    if (mediaRecorder && recording) {
      mediaRecorder.stop();
      recording = false;
      recBtn.classList.remove('recording');
      recBtn.textContent = '🎤';
      statusEl.textContent = 'Processando áudio...';
    }
  }

  async function sendAudio(blob) {
    addMessage('🎵 Áudio enviado (' + Math.round(blob.size / 1024) + ' KB)', 'user');
    const pending = addMessage('Transcrevendo', 'bot', 'dot-typing');
    try {
      const res = await fetch(TRANSCRIBE_URL, {
        method: 'POST',
        headers: { 'Content-Type': blob.type || 'audio/webm' },
        body: blob,
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const text = data.transcription || data.text || '(sem transcrição)';
      pending.classList.remove('dot-typing');
      pending.textContent = text;
      statusEl.textContent = 'Pronto para gravar';
    } catch (err) {
      pending.classList.remove('dot-typing');
      pending.textContent = 'Erro ao transcrever: ' + err.message;
      statusEl.textContent = 'Erro — tente novamente';
    }
  }

  const secureCtx = window.isSecureContext;
  const hasMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  if (!secureCtx || !hasMedia) {
    recBtn.disabled = true;
    recBtn.style.opacity = '0.5';
    recBtn.title = 'Microfone indisponível neste contexto';
    addMessage('Gravação por microfone indisponível aqui (contexto seguro: ' + secureCtx + ', API de mídia: ' + hasMedia + '). Use o botão de anexo para enviar um arquivo de áudio.', 'bot');
  }

  recBtn.addEventListener('click', () => { recording ? stopRecording() : startRecording(); });
  fileBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (f) { statusEl.textContent = 'Processando áudio...'; sendAudio(f); }
    fileInput.value = '';
  });
</script>
</body>
</html>
